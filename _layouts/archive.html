---
layout: default
---
<h1 class="post-headline">
    Archive of posts 
    {% if page.type == "year" %}
        from {{ page.date | date: "%Y" }}
    {% else %}
        with {{ page.type }} '{{ page.title }}'
    {% endif %}
</h1>
<ul class="posts">
    {% for post in page.posts %}
    <li>
        <span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span>
        <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
</ul>
